name: "Build Android APK (Cloud)"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  export-android:
    name: "Export Black Fate APK"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.2

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "Setup Android Keystore, Templates & Settings"
        run: |
          set -e
          echo "=== 1. Generating Debug Keystore ==="
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Mohamed Emad,O=Black Fate,C=EG" -validity 9999
          cp debug.keystore /root/debug.keystore 2>/dev/null || true

          echo "=== 2. Configuring Export Templates ==="
          mkdir -p "$HOME/.local/share/godot/templates/3.5.2.stable"
          cp -r /root/.local/share/godot/templates/* "$HOME/.local/share/godot/templates/" 2>/dev/null || true
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/templates/" 2>/dev/null || true

          TEMPLATE_DIR="$HOME/.local/share/godot/templates/3.5.2.stable"
          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
              FOUND_APK=$(find /root "$HOME" -name "android_debug.apk" 2>/dev/null | head -n 1)
              if [ -n "$FOUND_APK" ]; then
                  echo "Found template at $FOUND_APK, copying..."
                  cp "$(dirname "$FOUND_APK")"/* "$TEMPLATE_DIR/" 2>/dev/null || true
              fi
          fi

          echo "=== 3. Configuring Editor Settings ==="
          mkdir -p "$HOME/.config/godot"
          if [ -f "/root/.config/godot/editor_settings-3.tres" ]; then
              cp -r /root/.config "$HOME/"
          else
              godot -e -q 2>/dev/null || true
          fi

          cat << 'EOF' >> "$HOME/.config/godot/editor_settings-3.tres"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/adb = "/usr/bin/adb"
export/android/jarsigner = "/usr/bin/jarsigner"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
          echo "Editor settings configured successfully!"

      - name: "Build Android APK via Godot"
        run: |
          mkdir -p build/android
          godot -v --export-debug "Android" build/android/BlackFate_raw.apk

      - name: "Sign APK with V2 & V3 Signatures"
        run: |
          set -e
          ZIPALIGN=$(which zipalign 2>/dev/null || find /usr -name zipalign 2>/dev/null | head -n 1)
          APKSIGNER=$(which apksigner 2>/dev/null || find /usr -name apksigner 2>/dev/null | head -n 1)

          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
              apt-get update && apt-get install -y zipalign apksigner
              ZIPALIGN=$(which zipalign)
              APKSIGNER=$(which apksigner)
          fi

          echo "Using zipalign at: $ZIPALIGN"
          echo "Using apksigner at: $APKSIGNER"

          "$ZIPALIGN" -f -p 4 build/android/BlackFate_raw.apk build/android/BlackFate_aligned.apk
          "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build/android/BlackFate.apk build/android/BlackFate_aligned.apk
          "$APKSIGNER" verify --verbose build/android/BlackFate.apk
          echo "=== APK Successfully Built, Signed and Verified! ==="

      - name: "Upload APK to GitHub (Direct Download)"
        uses: actions/upload-artifact@v4
        with:
          name: BlackFate-Android-APK
          path: build/android/BlackFate.apk
