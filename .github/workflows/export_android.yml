name: "Build Android APK (Cloud)"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  export-android:
    name: "Export Black Fate APK"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.2

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "Setup Android Keystore, Templates & Settings"
        run: |
          # 1. Create debug keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Mohamed Emad,O=Black Fate,C=EG" -validity 9999
          
          # 2. Setup export templates in $HOME
          mkdir -p "$HOME/.local/share/godot/templates/3.5.2.stable"
          cp -r /root/.local/share/godot/templates/* "$HOME/.local/share/godot/templates/" 2>/dev/null || true
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/templates/" 2>/dev/null || true
          
          # 3. Setup Editor Settings safely using python
          godot -e -q 2>/dev/null || true
          python3 -c "
          import os
          cfg_path = os.path.expanduser('~/.config/godot/editor_settings-3.tres')
          os.makedirs(os.path.dirname(cfg_path), exist_ok=True)
          pwd = os.getcwd()
          with open(cfg_path, 'a') as f:
              f.write('export/android/android_sdk_path = \"/usr/lib/android-sdk\"\n')
              f.write('export/android/debug_keystore = \"' + pwd + '/debug.keystore\"\n')
              f.write('export/android/debug_keystore_user = \"androiddebugkey\"\n')
              f.write('export/android/debug_keystore_pass = \"android\"\n')
          print('Settings updated successfully!')
          "

      - name: "Build Android APK via Godot"
        run: |
          mkdir -p build/android
          godot -v --export-debug "Android" build/android/BlackFate_raw.apk

      - name: "Sign APK with V2 & V3 Signatures"
        run: |
          zipalign -f -p 4 build/android/BlackFate_raw.apk build/android/BlackFate_aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build/android/BlackFate.apk build/android/BlackFate_aligned.apk
          apksigner verify --verbose build/android/BlackFate.apk

      - name: "Upload APK to GitHub (Direct Download)"
        uses: actions/upload-artifact@v4
        with:
          name: BlackFate-Android-APK
          path: build/android/BlackFate.apk
